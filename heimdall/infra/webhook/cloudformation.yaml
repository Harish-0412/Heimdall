AWSTemplateFormatVersion: '2010-09-09'
Description: Heimdall signed GitHub webhook ingress, per-PR FIFO queue and monitored dead letter queue.
Parameters:
  LambdaArtifactBucket:
    Type: String
    Description: Bucket holding the built Linux bootstrap ZIP.
  LambdaArtifactKey:
    Type: String
  WebhookSecretArn:
    Type: String
    Description: ARN of the Secrets Manager string containing the GitHub webhook secret.
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional existing SNS topic for an operator notification.
Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 6
  WebhookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: webhook-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WebhookQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WebhookSecretArn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WebhookLogGroup.Arn
  WebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-webhook'
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [arm64]
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt WebhookRole.Arn
      Code: {S3Bucket: !Ref LambdaArtifactBucket, S3Key: !Ref LambdaArtifactKey}
      Environment:
        Variables:
          HEIMDALL_SQS_URL: !Ref WebhookQueue
          HEIMDALL_GITHUB_WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn
  WebhookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # Avoid a circular function -> role -> log group -> function dependency.
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-webhook'
      RetentionInDays: 14
  WebhookAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: !Sub '${AWS::StackName}-webhook', ProtocolType: HTTP}
  WebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebhookAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebhookFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000
  WebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebhookAPI
      RouteKey: 'POST /v1/github/webhook'
      Target: !Join ['/', [integrations, !Ref WebhookIntegration]]
  WebhookStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebhookAPI
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 100, ThrottlingRateLimit: 50}
  WebhookInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebhookFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebhookAPI}/*/POST/v1/github/webhook'
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A Heimdall webhook exhausted processing retries; inspect the DLQ and durable inbox, then redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt DeadLetterQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
Outputs:
  WebhookURL: {Value: !Sub '${WebhookAPI.ApiEndpoint}/v1/github/webhook'}
  QueueURL: {Value: !Ref WebhookQueue}
  QueueARN: {Value: !GetAtt WebhookQueue.Arn}
  DeadLetterQueueURL: {Value: !Ref DeadLetterQueue}
  DeadLetterAlarmName: {Value: !Ref DeadLetterAlarm}
