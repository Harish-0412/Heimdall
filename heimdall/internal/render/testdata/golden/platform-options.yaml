# stage: baseline-db, step: prepare
---
apiVersion: v1
data:
  clone.sql: |
    -- Heimdall: replace the live database with a copy of the frozen baseline.
    -- Used by the clone step and by reset. Runs as the superuser. Idempotent.
    \set ON_ERROR_STOP on
    DROP DATABASE IF EXISTS app WITH (FORCE);
    CREATE DATABASE app TEMPLATE app_baseline OWNER app;
  freeze.sql: |
    -- Heimdall: freeze the migrated, seeded baseline as a template.
    -- Runs as the superuser. Idempotent.
    \set ON_ERROR_STOP on
    ALTER DATABASE app_baseline WITH ALLOW_CONNECTIONS false;
    SELECT count(pg_terminate_backend(pid)) AS disconnected
      FROM pg_stat_activity WHERE datname = 'app_baseline' AND pid <> pg_backend_pid();
    ALTER DATABASE app_baseline IS_TEMPLATE true;
  prepare.sql: |
    -- Heimdall: create a fresh, empty baseline database.
    -- Runs as the superuser. Idempotent.
    \set ON_ERROR_STOP on

    -- The application role owns its databases and nothing else.
    SELECT 'CREATE ROLE app LOGIN'
     WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app')
    \gexec
    ALTER ROLE app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
      PASSWORD :'app_password';

    -- Rebuild from scratch: no leftovers from an older generation.
    SELECT 'ALTER DATABASE app_baseline IS_TEMPLATE false'
     WHERE EXISTS (SELECT FROM pg_database WHERE datname = 'app_baseline')
    \gexec
    DROP DATABASE IF EXISTS app_baseline WITH (FORCE);
    CREATE DATABASE app_baseline OWNER app;
