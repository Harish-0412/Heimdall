# Default values for heimdall-agent. README.md documents every permission the
# chart grants, and docs/agent.md how the agent works.

image:
  repository: ghcr.io/heimdall-dev/heimdall-agent
  # Defaults to the chart's appVersion.
  tag: ""
  # Pin the image by digest in production ("sha256:..."); takes precedence
  # over tag, which can be moved after review.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Replicas elect a leader; one reconciles at a time and all serve the
# admission webhook. 2 gives fast failover.
replicaCount: 1

# debug | info | warn | error
logLevel: info

# Where desired state comes from (ADR 0010).
#   cluster:   PreviewEnvironment objects in this namespace are the desired
#              state; operators kubectl-apply them.
#   configmap: a DesiredState document in a ConfigMap in this namespace; the
#              agent writes the PreviewEnvironment objects, and only the agent
#              may (admission policy). Until P5, when the control plane's API
#              becomes the source.
source:
  type: cluster
  configMap: heimdall-desired-state
  key: desired-state.yaml
  syncInterval: 30s

# The cluster, as previews see it (docs/rendering.md, "Platform settings").
platform:
  # Required: the DNS zone covered by the cluster's wildcard certificate.
  baseDomain: ""
  urlScheme: https
  urlPort: 0
  # The shared Gateway preview routes attach to (ADR 0008).
  gateway:
    namespace: heimdall-gateway
    name: heimdall
    sectionName: ""
  # NetworkPolicyPeers that may reach public services; default: the
  # Gateway's namespace. Use an ipBlock for data planes outside the cluster.
  ingressPeers: []
  # Where previews resolve names; default: kube-dns in kube-system.
  dnsPeers: []
  # Destinations outside the cluster previews may reach (default none).
  egressCIDRs: []
  storageClassName: ""
  # Pin previews to a dedicated, tainted node pool (P7).
  nodeSelector: {}
  tolerations: []
  runtimeClassName: ""
  imageMirror: ""
  writableRootFilesystem: false

# Tenant policy (ADR 0006) until the control plane delivers it (P5).
# Omitted limits take the platform defaults (docs/config-reference.md).
policy:
  maxVisibility: private
  allowLargeSize: false
  # [] allows no secrets; delete the key to allow any.
  allowedSecrets: []
  # Registries prebuilt images may come from; omit to allow any.
  # allowedRegistries: ["ghcr.io/your-org/"]

operations:
  maxConcurrent: 4
  stepTimeout: 10m
  resyncInterval: 5m
  maxBackoff: 10m

# Orphan removal (ADR 0005): ownership verified, older than gracePeriod,
# confirmed by a second pass, and only after an authoritative read.
sweeper:
  enabled: true
  dryRun: false
  interval: 5m
  gracePeriod: 30m

rbac:
  # Cluster-wide get/list/watch on preview workload kinds. The P3 agent reads
  # inside preview namespaces through its per-namespace role, so it does not
  # need this. Secrets, ConfigMaps and logs are never readable cluster-wide.
  clusterWideRead: false
  # Let the built-in view/edit/admin roles read (view) and write (edit,
  # admin) PreviewEnvironments, in namespaces where they are bound. Only this
  # release's namespace holds PreviewEnvironments the agent acts on.
  aggregateToDefaultRoles: true

admissionPolicy:
  # Confine the agent's writes with ValidatingAdmissionPolicies (Kubernetes
  # 1.30+). The agent refuses to act until it observes them enforced.
  enabled: true

webhook:
  port: 9443
  # Fail closed: an unvalidated PreviewEnvironment is never admitted.
  failurePolicy: Fail
  timeoutSeconds: 10

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  # For example eks.amazonaws.com/role-arn when the agent pulls config bundles
  # from a private registry with IAM (IRSA). Previews never get this identity.
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

metrics:
  port: 8443
  # HTTPS with Kubernetes authentication and authorization: scrapers need a
  # token whose identity may "get" /metrics (the metrics-reader ClusterRole).
  secure: true

probes:
  port: 8081

networkPolicy:
  # Allow ingress only to the webhook and metrics ports.
  enabled: true
  # Peers allowed to scrape metrics (NetworkPolicyPeer list); empty allows
  # any source.
  metricsFrom: []
