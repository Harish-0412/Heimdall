{{- if .Values.networkPolicy.enabled }}
# Only two things connect to the agent: the API server calling the admission
# webhook, and a metrics scraper. The API server's source address differs per
# cluster (often the host network), so the webhook port is open to any
# source; it serves TLS with a certificate only the API server trusts.
# Egress stays open because the API server's address differs per cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heimdall-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heimdall-agent.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: webhook
          protocol: TCP
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
