{{- if .Values.networkPolicy.enabled }}
# Nothing needs to connect to the agent except a metrics scraper: it pulls
# its work from the control plane (ADR 0004). Egress stays open because the
# API server's address differs per cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "heimdall-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heimdall-agent.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
