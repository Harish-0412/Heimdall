{{- if .Values.admissionPolicy.enabled }}
{{- $fullname := include "heimdall-agent.fullname" . }}
{{- $prefix := include "heimdall-agent.previewPrefix" . }}
{{- $agent := include "heimdall-agent.username" . }}
{{- /*
RBAC cannot say "only namespaces you created", so these policies do. They
apply only to requests from the agent's service account and deny:
  - creating, changing or deleting any namespace that is not a preview
    namespace (name prefix and heimdall.dev/preview=true label), including
    turning an existing namespace into one by labelling it;
  - any RoleBinding outside preview namespaces, or one that binds anything but
    the preview-manager role.
A third policy protects the agent's inputs and records from everyone else
(<fullname>-environments, below).
Reads do not pass through admission; read access is limited by RBAC alone.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "heimdall-agent.namespacePolicy" . }}
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: is-heimdall-agent
      expression: {{ printf "request.userInfo.username == %s" ($agent | squote) | quote }}
  variables:
    - name: prefix
      expression: {{ $prefix | squote | quote }}
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        ({{ include "heimdall-agent.celIsPreview" (dict "obj" "object") }})
      message: "the Heimdall agent may only create or update namespaces named {{ $prefix }}* that carry heimdall.dev/preview=true"
      reason: Forbidden
    - expression: >-
        request.operation == 'CREATE' ||
        ({{ include "heimdall-agent.celIsPreview" (dict "obj" "oldObject") }})
      message: "the Heimdall agent may only change or delete namespaces it created for previews"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "heimdall-agent.namespacePolicy" . }}
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  policyName: {{ include "heimdall-agent.namespacePolicy" . }}
  validationActions: ["Deny"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-rolebindings
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: is-heimdall-agent
      expression: {{ printf "request.userInfo.username == %s" ($agent | squote) | quote }}
  variables:
    - name: prefix
      expression: {{ $prefix | squote | quote }}
  validations:
    - expression: >-
        namespaceObject != null &&
        ({{ include "heimdall-agent.celIsPreview" (dict "obj" "namespaceObject") }})
      message: "the Heimdall agent may only manage role bindings inside preview namespaces"
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == {{ include "heimdall-agent.previewManager" . | squote }})
      message: "the Heimdall agent may only bind {{ include "heimdall-agent.previewManager" . }}"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-rolebindings
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-rolebindings
  validationActions: ["Deny"]
---
{{- /*
PreviewEnvironments in this namespace are the agent's inputs and records, so
for everyone but the agent (and the cluster's own controllers, which must be
able to delete them with the namespace):
  - status is read-only: it records what was deployed (deployedGeneration,
    completedResetNonce), and a forged record would make the agent skip work;
  - with a source other than the cluster, the objects are generated from that
    source and only metadata other than heimdall.dev/source may change:
    change the desired state there instead.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-environments
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    resourceRules:
      - apiGroups: ["heimdall.dev"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["previewenvironments", "previewenvironments/status"]
  matchConditions:
    - name: not-heimdall-agent
      expression: {{ printf "request.userInfo.username != %s" ($agent | squote) | quote }}
    - name: not-a-cluster-controller
      expression: >-
        request.userInfo.username != 'system:kube-controller-manager' &&
        !request.userInfo.username.startsWith('system:serviceaccount:kube-system:')
  variables:
    # subResource is absent, not empty, on requests for the object itself.
    - name: isStatus
      expression: "has(request.subResource) && request.subResource == 'status'"
  validations:
    - expression: "!variables.isStatus"
      message: "PreviewEnvironment status is written by the Heimdall agent alone"
      reason: Forbidden
    {{- if ne .Values.source.type "cluster" }}
    - expression: >-
        variables.isStatus ||
        (request.operation == 'UPDATE' && object.spec == oldObject.spec &&
          (has(object.metadata.labels) && 'heimdall.dev/source' in object.metadata.labels ? object.metadata.labels['heimdall.dev/source'] : '') ==
          (has(oldObject.metadata.labels) && 'heimdall.dev/source' in oldObject.metadata.labels ? oldObject.metadata.labels['heimdall.dev/source'] : ''))
      message: "PreviewEnvironments here are generated from the {{ .Values.source.type }} desired state ({{ .Values.source.configMap }}); change that instead"
      reason: Forbidden
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-environments
  labels:
    {{- include "heimdall-agent.labels" . | nindent 4 }}
spec:
  policyName: {{ $fullname }}-environments
  validationActions: ["Deny"]
{{- end }}
